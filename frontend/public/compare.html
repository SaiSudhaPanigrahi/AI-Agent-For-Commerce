<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mercury Compare</title>
    <style>
      :root {
        --bg: #091128;
        --panel: rgba(18, 26, 56, 0.92);
        --card: rgba(15, 23, 50, 0.96);
        --line: rgba(255, 255, 255, 0.1);
        --text: #eaf4ff;
        --muted: #a8c3d9;
        --accent: #19e3ff;
        --accent2: #19ffd2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--text);
        background:
          radial-gradient(900px 420px at 10% -10%, rgba(25, 227, 255, 0.18), transparent 60%),
          radial-gradient(780px 380px at 90% -10%, rgba(25, 255, 210, 0.12), transparent 60%),
          linear-gradient(180deg, var(--bg), #060d21);
      }
      .wrap {
        max-width: 1220px;
        margin: 0 auto;
        padding: 30px 22px 50px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 0.2px;
      }
      .ai {
        color: var(--accent);
        text-shadow: 0 0 14px rgba(25, 227, 255, 0.45);
      }
      .muted { color: var(--muted); font-size: 14px; margin-top: 6px; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        border: 1px solid rgba(25, 227, 255, 0.5);
        color: var(--accent);
        background: transparent;
        border-radius: 10px;
        height: 36px;
        padding: 0 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .panel {
        margin-top: 14px;
        background: var(--panel);
        border-radius: 16px;
        border: 1px solid var(--line);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        padding: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .thumb {
        height: 185px;
        border-radius: 10px;
        background: #0a1127;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.07);
      }
      .thumb img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .title { font-size: 16px; font-weight: 900; }
      .meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
        margin-top: 7px;
      }
      .price { color: var(--accent2); font-weight: 800; }
      .rec-list {
        margin: 0;
        padding-left: 18px;
      }
      .rec-list li {
        margin-top: 6px;
        color: #d7ebfb;
        line-height: 1.35;
      }
      .tag {
        display: inline-block;
        margin-top: 7px;
        font-size: 11px;
        color: var(--accent);
        border: 1px solid rgba(25, 227, 255, 0.4);
        border-radius: 999px;
        padding: 3px 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th, td {
        border: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }
      th { color: var(--muted); font-weight: 700; }
      .empty {
        margin-top: 40px;
        text-align: center;
        color: var(--muted);
        font-size: 15px;
      }
      @media (max-width: 700px) {
        .top { flex-direction: column; align-items: flex-start; }
        h1 { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <h1>Mercury <span class="ai">AI</span> Product Compare</h1>
          <div class="muted">Separate comparison window for selected catalog items.</div>
        </div>
        <div class="actions">
          <button id="refreshBtn">Refresh</button>
          <button id="clearBtn">Clear</button>
          <button id="closeBtn">Close</button>
        </div>
      </div>

      <div id="content"></div>
    </div>

    <script>
      const STORAGE_KEY = "mercury_compare_items_v1";
      const state = { aiRequestSeq: 0 };

      const byId = (id) => document.getElementById(id);
      const escapeHtml = (value) =>
        String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");

      function getItems() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (_) {
          return [];
        }
      }

      function setItems(items) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items || []));
      }

      function formatPrice(price) {
        const n = Number(price);
        if (Number.isNaN(n)) return "n/a";
        return `$${n.toFixed(2)}`;
      }

      function buildImageSrc(item) {
        const raw = String(item.image_path || item.image || "").trim();
        if (!raw) return "";
        if (/^https?:\/\//i.test(raw)) return raw;
        if (raw.startsWith("/data/")) return raw;
        if (raw.startsWith("data/")) return `/${raw}`;
        if (raw.startsWith("/")) return raw;
        return `/data/${raw}`;
      }

      async function fetchCompareAdvice(items) {
        const compareItems = (items || []).map((it) => ({
          id: it.id,
          title: it.title,
          category: it.category,
          color: it.color,
          price: Number(it.price),
          description: it.description,
          image_path: it.image_path,
        }));
        const res = await fetch("/api/compare_advice", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            items: compareItems,
            user_goal: "Best overall value for purchase decision",
            require_ai: false,
          }),
        });
        if (!res.ok) {
          const payload = await res.json().catch(() => ({}));
          throw new Error(payload.detail || "AI compare unavailable");
        }
        return res.json();
      }

      function renderAdvicePanel(advice) {
        const sourceEl = byId("aiSource");
        const summaryEl = byId("aiSummary");
        const listEl = byId("aiList");
        if (!sourceEl || !summaryEl || !listEl) return;

        const provider = String((advice && advice.provider) || "").toLowerCase();
        const source =
          provider === "gemini"
            ? "Gemini"
            : provider === "groq"
              ? "Groq"
              : "heuristic fallback";
        sourceEl.textContent = `AI Source: ${source}`;
        summaryEl.textContent = advice.summary || "Recommendation generated.";
        const bullets =
          Array.isArray(advice.bullets) && advice.bullets.length
            ? advice.bullets
            : ["No additional recommendation notes returned."];
        listEl.innerHTML = bullets.map((line) => `<li>${escapeHtml(line)}</li>`).join("");
      }

      function renderAdviceError(message) {
        const sourceEl = byId("aiSource");
        const summaryEl = byId("aiSummary");
        const listEl = byId("aiList");
        if (!sourceEl || !summaryEl || !listEl) return;
        sourceEl.textContent = "AI Source: unavailable";
        summaryEl.textContent = message || "AI compare is currently unavailable.";
        listEl.innerHTML = "<li>Check backend availability. Compare tries Gemini, then Groq, then heuristic fallback automatically.</li>";
      }

      async function updateAdvice(items, seq) {
        const sourceEl = byId("aiSource");
        const summaryEl = byId("aiSummary");
        const listEl = byId("aiList");
        if (sourceEl) sourceEl.textContent = "AI Source: analyzing...";
        if (summaryEl) summaryEl.textContent = "Analyzing compared products...";
        if (listEl) listEl.innerHTML = "";

        try {
          const advice = await fetchCompareAdvice(items);
          if (seq !== state.aiRequestSeq) return;
          renderAdvicePanel(advice);
        } catch (err) {
          if (seq !== state.aiRequestSeq) return;
          renderAdviceError(err instanceof Error ? err.message : "AI compare is currently unavailable.");
        }
      }

      function render() {
        const items = getItems().slice(0, 3);
        const content = byId("content");
        if (!items.length) {
          content.innerHTML = `
            <div class="panel empty">
              No compared items yet. Go back to Mercury and click "Add Compare", then "Open Compare Window".
            </div>
          `;
          return;
        }

        const cards = items
          .map(
            (it) => `
              <div class="card">
                <div class="thumb">
                  <img
                    src="${escapeHtml(buildImageSrc(it))}"
                    alt="${escapeHtml(it.title || "Product image")}"
                    loading="lazy"
                    onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22600%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%230a1127%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23b8d4e8%22 font-size=%2232%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>Image unavailable</text></svg>';"
                  />
                </div>
                <div class="title">${escapeHtml(it.title || "Untitled item")}</div>
                <div class="meta">${escapeHtml(it.category || "n/a")} • ${escapeHtml(it.color || "n/a")}</div>
                <div class="row"><span>Price</span><span class="price">${formatPrice(it.price)}</span></div>
                <div class="row"><span>Description</span><span style="max-width:70%; text-align:right;">${escapeHtml(it.description || "n/a")}</span></div>
                <div class="tag">AI comparison ready</div>
              </div>
            `,
          )
          .join("");

        const rows = [
          ["Title", ...items.map((i) => escapeHtml(i.title || "n/a"))],
          ["Category", ...items.map((i) => escapeHtml(i.category || "n/a"))],
          ["Color", ...items.map((i) => escapeHtml(i.color || "n/a"))],
          ["Price", ...items.map((i) => formatPrice(i.price))],
        ];

        const headers = items
          .map((_, idx) => `<th>Item ${idx + 1}</th>`)
          .join("");

        const tableRows = rows
          .map(
            (row) => `
              <tr>
                <th>${row[0]}</th>
                ${row.slice(1).map((val) => `<td>${val}</td>`).join("")}
              </tr>
            `,
          )
          .join("");

        content.innerHTML = `
          <div class="panel">
            <div class="title">AI Recommendation</div>
            <div id="aiSource" class="tag">AI Source: analyzing...</div>
            <div id="aiSummary" style="margin-top:8px; color:#e7f5ff; font-weight:700;">Analyzing compared products...</div>
            <ul id="aiList" class="rec-list"></ul>
          </div>
          <div class="panel">
            <div class="grid">${cards}</div>
          </div>
          <div class="panel">
            <table>
              <thead>
                <tr>
                  <th>Field</th>
                  ${headers}
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        `;

        state.aiRequestSeq += 1;
        void updateAdvice(items, state.aiRequestSeq);
      }

      byId("refreshBtn").addEventListener("click", render);
      byId("clearBtn").addEventListener("click", () => {
        setItems([]);
        render();
      });
      byId("closeBtn").addEventListener("click", () => window.close());

      window.addEventListener("storage", (event) => {
        if (event.key === STORAGE_KEY) render();
      });

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== "MERCURY_COMPARE_ITEMS") return;
        const incoming = Array.isArray(event.data.payload) ? event.data.payload : [];
        setItems(incoming.slice(0, 3));
        render();
      });

      render();
    </script>
  </body>
</html>
