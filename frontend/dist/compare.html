<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mercury Compare</title>
    <style>
      :root {
        --bg: #091128;
        --panel: rgba(18, 26, 56, 0.92);
        --card: rgba(15, 23, 50, 0.96);
        --line: rgba(255, 255, 255, 0.1);
        --text: #eaf4ff;
        --muted: #a8c3d9;
        --accent: #19e3ff;
        --accent2: #19ffd2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--text);
        background:
          radial-gradient(900px 420px at 10% -10%, rgba(25, 227, 255, 0.18), transparent 60%),
          radial-gradient(780px 380px at 90% -10%, rgba(25, 255, 210, 0.12), transparent 60%),
          linear-gradient(180deg, var(--bg), #060d21);
      }
      .wrap {
        max-width: 1220px;
        margin: 0 auto;
        padding: 30px 22px 50px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 0.2px;
      }
      .muted { color: var(--muted); font-size: 14px; margin-top: 6px; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        border: 1px solid rgba(25, 227, 255, 0.5);
        color: var(--accent);
        background: transparent;
        border-radius: 10px;
        height: 36px;
        padding: 0 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .panel {
        margin-top: 14px;
        background: var(--panel);
        border-radius: 16px;
        border: 1px solid var(--line);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        padding: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .title { font-size: 16px; font-weight: 900; }
      .meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
        margin-top: 7px;
      }
      .price { color: var(--accent2); font-weight: 800; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th, td {
        border: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }
      th { color: var(--muted); font-weight: 700; }
      .empty {
        margin-top: 40px;
        text-align: center;
        color: var(--muted);
        font-size: 15px;
      }
      @media (max-width: 700px) {
        .top { flex-direction: column; align-items: flex-start; }
        h1 { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <h1>Mercury Product Compare</h1>
          <div class="muted">Separate comparison window for selected catalog items.</div>
        </div>
        <div class="actions">
          <button id="refreshBtn">Refresh</button>
          <button id="clearBtn">Clear</button>
          <button id="closeBtn">Close</button>
        </div>
      </div>

      <div id="content"></div>
    </div>

    <script>
      const STORAGE_KEY = "mercury_compare_items_v1";

      const byId = (id) => document.getElementById(id);
      const escapeHtml = (value) =>
        String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");

      function getItems() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (_) {
          return [];
        }
      }

      function setItems(items) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items || []));
      }

      function formatPrice(price) {
        const n = Number(price);
        if (Number.isNaN(n)) return "n/a";
        return `$${n.toFixed(2)}`;
      }

      function render() {
        const items = getItems().slice(0, 3);
        const content = byId("content");
        if (!items.length) {
          content.innerHTML = `
            <div class="panel empty">
              No compared items yet. Go back to Mercury and click "Add Compare", then "Open Compare Window".
            </div>
          `;
          return;
        }

        const cards = items
          .map(
            (it) => `
              <div class="card">
                <div class="title">${escapeHtml(it.title || "Untitled item")}</div>
                <div class="meta">${escapeHtml(it.category || "n/a")} • ${escapeHtml(it.color || "n/a")}</div>
                <div class="row"><span>Price</span><span class="price">${formatPrice(it.price)}</span></div>
                <div class="row"><span>Score</span><span>${it.score != null ? Number(it.score).toFixed(3) : "n/a"}</span></div>
                <div class="row"><span>Description</span><span style="max-width:70%; text-align:right;">${escapeHtml(it.description || "n/a")}</span></div>
              </div>
            `,
          )
          .join("");

        const rows = [
          ["Title", ...items.map((i) => escapeHtml(i.title || "n/a"))],
          ["Category", ...items.map((i) => escapeHtml(i.category || "n/a"))],
          ["Color", ...items.map((i) => escapeHtml(i.color || "n/a"))],
          ["Price", ...items.map((i) => formatPrice(i.price))],
          ["Score", ...items.map((i) => (i.score != null ? Number(i.score).toFixed(3) : "n/a"))],
          ["Image Path", ...items.map((i) => escapeHtml(i.image_path || "n/a"))],
        ];

        const headers = items
          .map((_, idx) => `<th>Item ${idx + 1}</th>`)
          .join("");

        const tableRows = rows
          .map(
            (row) => `
              <tr>
                <th>${row[0]}</th>
                ${row.slice(1).map((val) => `<td>${val}</td>`).join("")}
              </tr>
            `,
          )
          .join("");

        content.innerHTML = `
          <div class="panel">
            <div class="grid">${cards}</div>
          </div>
          <div class="panel">
            <table>
              <thead>
                <tr>
                  <th>Field</th>
                  ${headers}
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        `;
      }

      byId("refreshBtn").addEventListener("click", render);
      byId("clearBtn").addEventListener("click", () => {
        setItems([]);
        render();
      });
      byId("closeBtn").addEventListener("click", () => window.close());

      window.addEventListener("storage", (event) => {
        if (event.key === STORAGE_KEY) render();
      });

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== "MERCURY_COMPARE_ITEMS") return;
        const incoming = Array.isArray(event.data.payload) ? event.data.payload : [];
        setItems(incoming.slice(0, 3));
        render();
      });

      render();
    </script>
  </body>
</html>
